<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" role="img" aria-label="System integration illustration">
  <defs>
    <linearGradient id="n1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A5DAB"/><stop offset="100%" style="stop-color:#2E7BD6"/>
    </linearGradient>
    <linearGradient id="n2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5B731"/><stop offset="100%" style="stop-color:#FFD06A"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="150" r="130" fill="url(#n1)" opacity="0.04"/>
  <rect x="50" y="40" width="300" height="200" rx="10" fill="#0D1B3E"/>
  <rect x="50" y="40" width="300" height="30" rx="10" fill="#152952"/>
  <circle cx="72" cy="55" r="5" fill="#EF4444" opacity="0.6"/>
  <circle cx="90" cy="55" r="5" fill="#F5B731" opacity="0.6"/>
  <circle cx="108" cy="55" r="5" fill="#4ADE80" opacity="0.6"/>
  <!-- Connections -->
  <g stroke-dasharray="4 3" stroke-width="1.5" opacity="0.4">
    <path d="M200 150 L100 100" stroke="#F5B731"/>
    <path d="M200 150 L300 100" stroke="#1A5DAB"/>
    <path d="M200 150 L100 205" stroke="#1A5DAB"/>
    <path d="M200 150 L300 205" stroke="#F5B731"/>
  </g>
  <!-- Central Odoo hub -->
  <circle cx="200" cy="150" r="34" fill="#0a1730" stroke="url(#n2)" stroke-width="2"/>
  <circle cx="200" cy="150" r="34" fill="url(#n1)" opacity="0.25"/>
  <text x="200" y="147" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="#FFD06A">Odoo</text>
  <text x="200" y="160" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#e8edf8" opacity="0.7">core</text>
  <!-- Satellite systems -->
  <g>
    <rect x="72" y="82" width="56" height="36" rx="6" fill="#0a1730"/>
    <rect x="82" y="92" width="30" height="5" rx="2" fill="#FFD06A" opacity="0.7"/>
    <rect x="82" y="102" width="36" height="4" rx="2" fill="white" opacity="0.14"/>
    <rect x="82" y="109" width="24" height="4" rx="2" fill="white" opacity="0.1"/>
  </g>
  <g>
    <rect x="272" y="82" width="56" height="36" rx="6" fill="#0a1730"/>
    <rect x="282" y="92" width="30" height="5" rx="2" fill="#8BB4E8" opacity="0.7"/>
    <rect x="282" y="102" width="36" height="4" rx="2" fill="white" opacity="0.14"/>
    <rect x="282" y="109" width="24" height="4" rx="2" fill="white" opacity="0.1"/>
  </g>
  <g>
    <rect x="72" y="188" width="56" height="36" rx="6" fill="#0a1730"/>
    <rect x="82" y="198" width="30" height="5" rx="2" fill="#8BB4E8" opacity="0.7"/>
    <rect x="82" y="208" width="36" height="4" rx="2" fill="white" opacity="0.14"/>
    <rect x="82" y="215" width="24" height="4" rx="2" fill="white" opacity="0.1"/>
  </g>
  <g>
    <rect x="272" y="188" width="56" height="36" rx="6" fill="#0a1730"/>
    <rect x="282" y="198" width="30" height="5" rx="2" fill="#FFD06A" opacity="0.7"/>
    <rect x="282" y="208" width="36" height="4" rx="2" fill="white" opacity="0.14"/>
    <rect x="282" y="215" width="24" height="4" rx="2" fill="white" opacity="0.1"/>
  </g>
  <!-- moving data dots -->
  <circle cx="150" cy="125" r="3" fill="#FFD06A"/>
  <circle cx="250" cy="125" r="3" fill="#8BB4E8"/>
  <circle cx="150" cy="177" r="3" fill="#8BB4E8"/>
  <circle cx="250" cy="177" r="3" fill="#FFD06A"/>
</svg>
