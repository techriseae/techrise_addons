<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" role="img" aria-label="Inventory and warehouse illustration">
  <defs>
    <linearGradient id="i1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A5DAB"/><stop offset="100%" style="stop-color:#2E7BD6"/>
    </linearGradient>
    <linearGradient id="i2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5B731"/><stop offset="100%" style="stop-color:#FFD06A"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="150" r="130" fill="url(#i1)" opacity="0.04"/>
  <rect x="50" y="40" width="300" height="200" rx="10" fill="#0D1B3E"/>
  <rect x="50" y="40" width="300" height="30" rx="10" fill="#152952"/>
  <circle cx="72" cy="55" r="5" fill="#EF4444" opacity="0.6"/>
  <circle cx="90" cy="55" r="5" fill="#F5B731" opacity="0.6"/>
  <circle cx="108" cy="55" r="5" fill="#4ADE80" opacity="0.6"/>
  <!-- Warehouse shelf with boxes -->
  <rect x="65" y="86" width="150" height="142" rx="6" fill="#0a1730"/>
  <line x1="65" y1="132" x2="215" y2="132" stroke="white" stroke-opacity="0.1"/>
  <line x1="65" y1="178" x2="215" y2="178" stroke="white" stroke-opacity="0.1"/>
  <rect x="78" y="100" width="26" height="26" rx="3" fill="#2E7BD6" opacity="0.85"/>
  <rect x="112" y="100" width="26" height="26" rx="3" fill="#F5B731">
    <animate attributeName="opacity" values="1;0.55;1" dur="2.8s" repeatCount="indefinite"/></rect>
  <rect x="146" y="100" width="26" height="26" rx="3" fill="#2E7BD6" opacity="0.85"/>
  <rect x="180" y="100" width="26" height="26" rx="3" fill="#2E7BD6" opacity="0.55"/>
  <rect x="78" y="146" width="26" height="26" rx="3" fill="#2E7BD6" opacity="0.55"/>
  <rect x="112" y="146" width="26" height="26" rx="3" fill="#2E7BD6" opacity="0.85"/>
  <rect x="146" y="146" width="26" height="26" rx="3" fill="#F5B731" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.45;0.9" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></rect>
  <rect x="78" y="192" width="26" height="26" rx="3" fill="#F5B731"/>
  <rect x="112" y="192" width="26" height="26" rx="3" fill="#2E7BD6" opacity="0.85"/>
  <rect x="146" y="192" width="26" height="26" rx="3" fill="#2E7BD6" opacity="0.55"/>
  <rect x="180" y="192" width="26" height="26" rx="3" fill="#2E7BD6" opacity="0.85"/>
  <!-- Stock panel + fill bar -->
  <rect x="227" y="86" width="108" height="70" rx="6" fill="#0a1730"/>
  <rect x="238" y="98" width="60" height="6" rx="3" fill="#FFD06A" opacity="0.8"/>
  <rect x="238" y="114" width="86" height="5" rx="2" fill="white" opacity="0.16"/>
  <rect x="238" y="126" width="70" height="5" rx="2" fill="white" opacity="0.12"/>
  <rect x="238" y="138" width="86" height="8" rx="4" fill="url(#i1)" opacity="0.3"/>
  <rect x="238" y="138" width="58" height="8" rx="4" fill="url(#i2)">
    <animate attributeName="width" values="20;80;46;20" keyTimes="0;0.4;0.75;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- barcode + moving scan line -->
  <rect x="227" y="166" width="108" height="62" rx="6" fill="#0a1730"/>
  <g fill="#e8edf8" opacity="0.85">
    <rect x="240" y="180" width="3" height="34"/><rect x="246" y="180" width="2" height="34"/>
    <rect x="251" y="180" width="4" height="34"/><rect x="258" y="180" width="2" height="34"/>
    <rect x="263" y="180" width="3" height="34"/><rect x="269" y="180" width="5" height="34"/>
    <rect x="277" y="180" width="2" height="34"/><rect x="282" y="180" width="3" height="34"/>
    <rect x="288" y="180" width="2" height="34"/><rect x="293" y="180" width="4" height="34"/>
    <rect x="300" y="180" width="2" height="34"/><rect x="305" y="180" width="3" height="34"/>
    <rect x="311" y="180" width="5" height="34"/><rect x="319" y="180" width="2" height="34"/>
  </g>
  <rect x="238" y="176" width="2.5" height="42" fill="#4ADE80" opacity="0.9">
    <animate attributeName="x" values="238;322;238" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>
