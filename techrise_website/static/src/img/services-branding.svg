<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" role="img" aria-label="Branding and marketing illustration">
  <defs>
    <linearGradient id="b1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A5DAB"/><stop offset="100%" style="stop-color:#2E7BD6"/>
    </linearGradient>
    <linearGradient id="b2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5B731"/><stop offset="100%" style="stop-color:#FFD06A"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="150" r="130" fill="url(#b1)" opacity="0.04"/>
  <rect x="50" y="40" width="300" height="200" rx="10" fill="#0D1B3E"/>
  <rect x="50" y="40" width="300" height="30" rx="10" fill="#152952"/>
  <circle cx="72" cy="55" r="5" fill="#EF4444" opacity="0.6"/>
  <circle cx="90" cy="55" r="5" fill="#F5B731" opacity="0.6"/>
  <circle cx="108" cy="55" r="5" fill="#4ADE80" opacity="0.6"/>
  <!-- Logo canvas -->
  <rect x="65" y="84" width="140" height="100" rx="6" fill="#0a1730"/>
  <g>
    <rect x="118" y="112" width="34" height="10" rx="2" fill="#F5B731"/>
    <rect x="130" y="112" width="10" height="44" rx="2" fill="#2E7BD6"/>
    <animateTransform attributeName="transform" type="rotate" values="-2 135 134;2 135 134;-2 135 134" dur="4s" repeatCount="indefinite"/>
  </g>
  <rect x="65" y="196" width="90" height="9" rx="3" fill="white" opacity="0.22"/>
  <rect x="65" y="210" width="120" height="5" rx="2" fill="white" opacity="0.12"/>
  <rect x="65" y="220" width="70" height="5" rx="2" fill="white" opacity="0.1"/>
  <!-- Colour palette swatches (pulse in sequence) -->
  <rect x="222" y="84" width="113" height="60" rx="6" fill="#0a1730"/>
  <rect x="234" y="96" width="60" height="5" rx="2" fill="white" opacity="0.2"/>
  <circle cx="240" cy="122" r="12" fill="#2E7BD6">
    <animate attributeName="r" values="12;13.5;12" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="268" cy="122" r="12" fill="#F5B731">
    <animate attributeName="r" values="12;13.5;12" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="296" cy="122" r="12" fill="#0D1B3E" stroke="white" stroke-opacity="0.2">
    <animate attributeName="r" values="12;13.5;12" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle cx="324" cy="122" r="11" fill="#4ADE80" opacity="0.7">
    <animate attributeName="r" values="11;12.5;11" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
  <!-- Campaign cards -->
  <rect x="222" y="152" width="54" height="32" rx="5" fill="#0a1730"/>
  <rect x="230" y="160" width="24" height="24" rx="4" fill="url(#b1)" opacity="0.4">
    <animate attributeName="opacity" values="0.25;0.6;0.25" dur="3s" repeatCount="indefinite"/></rect>
  <rect x="281" y="152" width="54" height="32" rx="5" fill="#0a1730"/>
  <rect x="289" y="160" width="24" height="24" rx="4" fill="url(#b2)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" begin="0.7s" repeatCount="indefinite"/></rect>
  <!-- megaphone accent -->
  <path d="M300 205 l24 -10 v34 l-24 -10 z" fill="url(#b2)" opacity="0.6"/>
  <rect x="292" y="212" width="10" height="10" rx="2" fill="url(#b2)" opacity="0.6"/>
  <path d="M326 200 q10 12 0 24" stroke="#FFD06A" stroke-width="2" opacity="0.4" fill="none">
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="1.8s" repeatCount="indefinite"/></path>
</svg>
