<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" role="img" aria-label="Accounting dashboard illustration">
  <defs>
    <linearGradient id="a1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A5DAB"/><stop offset="100%" style="stop-color:#2E7BD6"/>
    </linearGradient>
    <linearGradient id="a2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5B731"/><stop offset="100%" style="stop-color:#FFD06A"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="150" r="130" fill="url(#a1)" opacity="0.04"/>
  <rect x="50" y="40" width="300" height="200" rx="10" fill="#0D1B3E"/>
  <rect x="50" y="40" width="300" height="30" rx="10" fill="#152952"/>
  <circle cx="72" cy="55" r="5" fill="#EF4444" opacity="0.6"/>
  <circle cx="90" cy="55" r="5" fill="#F5B731" opacity="0.6"/>
  <circle cx="108" cy="55" r="5" fill="#4ADE80" opacity="0.6"/>
  <!-- KPI card with AED total -->
  <rect x="65" y="82" width="130" height="60" rx="6" fill="url(#a1)" opacity="0.14"/>
  <rect x="76" y="92" width="50" height="6" rx="3" fill="white" opacity="0.25"/>
  <text x="76" y="126" font-family="'Courier New',monospace" font-size="22" font-weight="700" fill="#FFD06A">AED</text>
  <!-- value bar fills -->
  <rect x="120" y="112" width="60" height="16" rx="3" fill="white" opacity="0.85">
    <animate attributeName="width" values="4;60;60;4" keyTimes="0;0.45;0.8;1" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <!-- VAT small card -->
  <rect x="205" y="82" width="130" height="28" rx="6" fill="url(#a2)" opacity="0.18"/>
  <rect x="216" y="90" width="40" height="6" rx="3" fill="#FFD06A" opacity="0.8"/>
  <rect x="216" y="100" width="70" height="5" rx="2" fill="white" opacity="0.2"/>
  <rect x="205" y="116" width="130" height="26" rx="6" fill="url(#a1)" opacity="0.10"/>
  <rect x="216" y="124" width="46" height="5" rx="2" fill="white" opacity="0.2"/>
  <rect x="216" y="133" width="86" height="4" rx="2" fill="white" opacity="0.12"/>
  <!-- Bar chart (bars grow from the baseline, staggered) -->
  <rect x="65" y="158" width="130" height="70" rx="6" fill="#0a1730"/>
  <rect x="80" y="218" width="14" height="0" rx="2" fill="#2E7BD6" opacity="0.75">
    <animate attributeName="height" values="0;18;18" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="218;200;200" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="100" y="218" width="14" height="0" rx="2" fill="#2E7BD6" opacity="0.75">
    <animate attributeName="height" values="0;30;30" keyTimes="0;0.5;1" dur="3s" begin="0.15s" repeatCount="indefinite"/>
    <animate attributeName="y" values="218;188;188" keyTimes="0;0.5;1" dur="3s" begin="0.15s" repeatCount="indefinite"/>
  </rect>
  <rect x="120" y="218" width="14" height="0" rx="2" fill="#F5B731">
    <animate attributeName="height" values="0;40;40" keyTimes="0;0.5;1" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="218;178;178" keyTimes="0;0.5;1" dur="3s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="140" y="218" width="14" height="0" rx="2" fill="#2E7BD6" opacity="0.75">
    <animate attributeName="height" values="0;26;26" keyTimes="0;0.5;1" dur="3s" begin="0.45s" repeatCount="indefinite"/>
    <animate attributeName="y" values="218;192;192" keyTimes="0;0.5;1" dur="3s" begin="0.45s" repeatCount="indefinite"/>
  </rect>
  <rect x="160" y="218" width="14" height="0" rx="2" fill="#F5B731">
    <animate attributeName="height" values="0;46;46" keyTimes="0;0.5;1" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="218;172;172" keyTimes="0;0.5;1" dur="3s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <!-- Invoice list (status chips softly blink) -->
  <rect x="205" y="158" width="130" height="70" rx="6" fill="#0a1730"/>
  <rect x="216" y="170" width="80" height="5" rx="2" fill="white" opacity="0.22"/>
  <rect x="308" y="169" width="18" height="7" rx="3" fill="#4ADE80" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.4s" repeatCount="indefinite"/></rect>
  <rect x="216" y="186" width="70" height="5" rx="2" fill="white" opacity="0.16"/>
  <rect x="308" y="185" width="18" height="7" rx="3" fill="#F5B731" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></rect>
  <rect x="216" y="202" width="88" height="5" rx="2" fill="white" opacity="0.12"/>
  <rect x="308" y="201" width="18" height="7" rx="3" fill="#4ADE80" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></rect>
  <rect x="216" y="216" width="60" height="5" rx="2" fill="white" opacity="0.1"/>
</svg>
